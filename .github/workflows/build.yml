name: Build

# Compile check for the rollback netcode work, plus a playable Windows build.
#
# Both recipes are lifted from the upstream .gitlab-ci.yml, which is the CI that
# actually works for this project. Simplifications versus upstream: no ccache, no
# GitLab code-quality report, no release/tag handling. The question being asked
# here is only "does it build, and can I play it".
#
# On worldwide-2.4 (the work ported onto the 2.4 release, WORLDWIDE.md 8.114)
# the dependencies are 2.4's: SDL2, not the SDL3 upstream moved to after 2.4,
# and WebM recording off, as 2.4's own CI built it.
#
# Linux, playable, two ways: a tarball for the harness (built as upstream 2.4's
# Debian jobs build, with its libraries carried in lib/, then checked on three
# distributions), and a Flatpak for testers (Kart Krew's Flathub manifest,
# .github/flatpak/). The Alpine job stays the compile check upstream runs.

on:
  # A push or pull request that touches only docs and Markdown files builds
  # nothing new, so it does not run. The harness accepts the last build as long
  # as nothing but those paths changed since its commit -- the same rule. Run by
  # hand from the Actions tab when a build is wanted anyway.
  push:
    branches:
      - master
      - rollback-netcode
      # The same work ported onto the 2.4 release (WORLDWIDE.md 8.114).
      - worldwide-2.4
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Alpine, GCC)
    runs-on: ubuntu-latest

    # 2.4 needs SDL2. Alpine 3.20 still ships the real one; later releases
    # replace it with sdl2-compat, SDL2's API over SDL3.
    container: alpine:3.20

    steps:
      # git must exist before actions/checkout can run; the image does not ship it.
      - name: Install prerequisites
        run: |
          apk add --update-cache \
            build-base cmake samurai \
            zlib zlib-dev libpng libpng-dev curl curl-dev \
            opus opus-dev sdl2 sdl2-dev \
            git

      - uses: actions/checkout@v4

      # The checkout is owned by a different user than the one the build runs as,
      # so without this git refuses to read the repo when CMake queries it.
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        run: |
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_COLOR_DIAGNOSTICS=ON \
            -DSRB2_CONFIG_DEV_BUILD=ON \
            -DSRB2_CONFIG_ENABLE_WEBM_MOVIES=OFF \
            -DSRB2_CONFIG_EXECINFO=NO

      - name: Build
        run: cmake --build build/

  # A Linux binary to run: the harness's build outside Windows (the laptop, the
  # Steam Deck in desktop mode, ROADMAP item 13), dropped into a 2.4 data folder
  # like the Windows exe. Built on Ubuntu 22.04, as upstream 2.4's Debian jobs
  # build theirs, so it runs on glibc 2.35 and newer. The system's SDL2 is used
  # (it brings the display, audio and input stack, and a Steam Deck's controller
  # support); what a desktop may lack, or have in another version -- curl and
  # what it needs, opus, png -- goes in lib/, found through $ORIGIN.
  linux-tarball:
    name: Linux x86_64 (Ubuntu 22.04, GCC, ${{ matrix.variant }})
    runs-on: ubuntu-latest
    container: ubuntu:22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: dev
            dev_build: 'ON'
            artifact: ringracers-linux64
          - variant: release
            dev_build: 'OFF'
            artifact: ringracers-linux64-release

    steps:
      - name: Install prerequisites
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates pkg-config \
            libsdl2-dev libpng-dev zlib1g-dev libcurl4-openssl-dev libopus-dev \
            patchelf

      - uses: actions/checkout@v4

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        run: |
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO="-g -O3 -DNDEBUG" \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-g -O3 -DNDEBUG" \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" \
            -DSRB2_CONFIG_ENABLE_WEBM_MOVIES=OFF \
            -DSRB2_CONFIG_DEV_BUILD=${{ matrix.dev_build }}

      - name: Build
        run: cmake --build build

      # The build already split its debug info into <exe>.debug (src/CMakeLists.txt).
      - name: Package
        run: |
          set -eu
          exe=$(find build/bin -maxdepth 1 -type f -name 'ringracers*' ! -name '*.debug' | head -n 1)
          name=$(basename "$exe")
          pkg="ringracers-worldwide-2.4-${{ matrix.variant }}-linux64"
          mkdir -p "dist/$pkg/lib"
          cp "$exe" "dist/$pkg/"
          [ -e "$exe.debug" ] && cp "$exe.debug" dist/

          # The system's own: glibc; SDL2 and the display, audio and input stack it
          # loads; and what the drivers share with it, newer on the host than here.
          system_lib() {
            case "$1" in
              linux-vdso*|ld-linux*|libc.so.*|libm.so.*|libdl.so.*|libpthread.so.*|librt.so.*|libresolv.so.*|libutil.so.*|libanl.so.*|libnsl.so.*) return 0 ;;
              libSDL2-2.0.so.*) return 0 ;;
              libGL*|libEGL*|libOpenGL*|libvulkan*|libX*|libxcb*|libwayland*|libdrm*|libgbm*|libasound*|libpulse*|libdbus*|libudev*|libsystemd*) return 0 ;;
              libz.so.*|libffi.so.*|libzstd.so.*|liblzma.so.*|libexpat.so.*|libgcc_s.so.*|libstdc++.so.*) return 0 ;;
            esac
            return 1
          }
          resolved() { ldd "$1" | awk '$2 == "=>" && $3 ~ /^\// {print $1, $3}'; }

          # Each library the game names, and all it needs in turn, but the system's.
          for soname in $(objdump -p "$exe" | awk '$1 == "NEEDED" {print $2}'); do
            system_lib "$soname" && continue
            path=$(resolved "$exe" | awk -v n="$soname" '$1 == n {print $2}')
            { echo "$soname $path"; resolved "$path"; } | while read -r so p; do
              system_lib "$so" && continue
              [ -e "dist/$pkg/lib/$so" ] || cp -L "$p" "dist/$pkg/lib/$so"
            done
          done
          for lib in "dist/$pkg"/lib/*; do patchelf --set-rpath '$ORIGIN' "$lib"; done
          patchelf --set-rpath '$ORIGIN/lib' "dist/$pkg/$name"

          echo "Bundled:"; ls -l "dist/$pkg/lib"
          echo "Left to the system:"; ldd "dist/$pkg/$name" | grep -v "dist/$pkg/lib" || true
          echo "Newest glibc symbol needed:"
          objdump -T "dist/$pkg/$name" "dist/$pkg"/lib/* | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1

          cat > "dist/$pkg/README-linux.txt" <<EOF
          Ring Racers Worldwide on the 2.4 release, Linux x86_64, ${{ matrix.variant }} build,
          commit ${{ github.sha }}.

          The game's data is not here. Put these files in a folder that holds the
          Ring Racers 2.4 data (bios.pk3 and the rest) and run ./$name from that
          folder, or set RINGRACERSWADDIR to the data folder. Config, saves and logs
          go to ~/.ringracers, or to the folder given with -home.

          Needs glibc 2.35 or newer (built on Ubuntu 22.04) and the system's SDL2,
          2.0.20 or newer, or sdl2-compat: libsdl2-2.0-0 on Debian and Ubuntu,
          sdl2-compat on Arch and SteamOS, SDL2 on Fedora. What else it needs is in
          lib/.
          EOF
          tar -C dist -czf "dist/$pkg.tar.gz" "$pkg"

      # A zip would lose the executable bit: the artifact carries the tarball.
      - name: Upload build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.debug
          if-no-files-found: error

  # The tarball on distributions it was not built on, each with nothing but its
  # own SDL2: every library the game and lib/ need must be found.
  linux-tarball-check:
    name: Linux tarball on ${{ matrix.distro }}
    needs: linux-tarball
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Ubuntu 24.04
            image: ubuntu:24.04
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libsdl2-2.0-0
          - distro: Arch Linux
            image: archlinux:latest
            install: pacman -Syu --noconfirm sdl2-compat tar gzip
          - distro: Fedora
            image: fedora:latest
            install: dnf install -y SDL2 tar gzip

    steps:
      - name: Install the system's SDL2
        run: ${{ matrix.install }}

      - uses: actions/download-artifact@v4
        with:
          name: ringracers-linux64-release-${{ github.sha }}

      - name: Every library found
        run: |
          set -eu
          tar -xzf ringracers-worldwide-2.4-release-linux64.tar.gz
          cd ringracers-worldwide-2.4-release-linux64
          exe=$(find . -maxdepth 1 -type f -name 'ringracers*')
          for f in "$exe" lib/*; do
            echo "== $f"
            /lib64/ld-linux-x86-64.so.2 --list "$f" | tee -a ../list.txt
          done
          if grep "not found" ../list.txt; then
            echo "ERROR: libraries missing on ${{ matrix.distro }}"
            exit 1
          fi

  # Kart Krew's own Linux build is their Flathub Flatpak: this is its manifest
  # (.github/flatpak/), building this checkout, carrying no game data. For the
  # alpha's testers -- a Steam Deck installs it from its desktop mode.
  flatpak:
    name: Linux x86_64 (Flatpak, release)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      # In src/, so flatpak-builder's own folders, made in the workspace, stay
      # out of the source it copies.
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: src/.github/flatpak/io.github.ringracers_worldwide.RingRacersWorldwide.yaml
          bundle: ringracers-worldwide-2.4.flatpak
          artifact-name: ringracers-flatpak-${{ github.sha }}

  windows:
    name: Windows x86_64 (clang cross, ${{ matrix.variant }})
    runs-on: ubuntu-latest

    # dev: DEVELOP defined, VERSION/SUBVERSION left at 0 -- the build every
    # measurement uses, under its historical artifact name.
    # release: DEVELOP off, so it carries the real version numbers and can see
    # the servers of that version. Needed for the compatibility policy (a
    # WORLDWIDE client on a vanilla server); only as useful as the release base
    # the branch sits on (WORLDWIDE.md 8.30).
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: dev
            dev_build: 'ON'
            artifact: ringracers-win64
          - variant: release
            dev_build: 'OFF'
            artifact: ringracers-win64-release

    # Same cross-compiler image upstream uses.
    container: mstorsjo/llvm-mingw:20260616

    env:
      # Prebuilt Windows dependencies published by Kart Krew. Upstream fetches
      # this with a GitLab CI job token, but the package is public, so the plain
      # gitlab.com URL works from here. The checksum is upstream's -- it matters,
      # since this is a third-party binary blob being linked into the build.
      SDK_URL: https://gitlab.com/api/v4/projects/83528690/packages/generic/ring-racers-sdk/1/rrsdk-msys2-clang64.zip
      SDK_SHA256: 1d816b61ce1936240ab067df98e5badd98fa642da0ae9afa87e85b61e30a4fd3

    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates cmake ninja-build curl unzip

      - uses: actions/checkout@v4

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch prebuilt Windows SDK
        run: |
          curl --fail --retry 3 --retry-delay 5 -L -o rrsdk.zip "$SDK_URL"

          echo "Verifying SDK checksum..."
          got=$(sha256sum rrsdk.zip | cut -d' ' -f1)
          if [ "$got" != "$SDK_SHA256" ]; then
            echo "ERROR: SDK checksum mismatch"
            echo "  expected: $SDK_SHA256"
            echo "  got:      $got"
            exit 1
          fi
          echo "Checksum OK."

          mkdir -p rrsdk
          unzip -q rrsdk.zip -d rrsdk
          rm -f rrsdk.zip

      - name: Write toolchain file
        run: |
          cat <<'EOF' > toolchain.cmake
          set(CMAKE_SYSTEM_NAME Windows)
          set(CMAKE_SYSTEM_PROCESSOR x86_64)

          set(CMAKE_C_COMPILER /opt/llvm-mingw/bin/x86_64-w64-mingw32-clang)
          set(CMAKE_CXX_COMPILER /opt/llvm-mingw/bin/x86_64-w64-mingw32-clang++)
          set(CMAKE_RC_COMPILER /opt/llvm-mingw/bin/x86_64-w64-mingw32-windres)

          set(CMAKE_FIND_ROOT_PATH /usr/x86_64-w64-mingw32)

          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF

      # The SDK carries SDL3, and 2.4 needs SDL2: built from its own repository
      # with the same toolchain, static, so the exe stays a single file.
      - name: Build SDL2
        run: |
          git clone --depth 1 --branch release-2.30.9 https://github.com/libsdl-org/SDL.git sdl2-src
          cmake -S sdl2-src -B sdl2-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sdl2" \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF
          cmake --build sdl2-build
          cmake --install sdl2-build

      - name: Configure
        run: |
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=toolchain.cmake \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/rrsdk;$GITHUB_WORKSPACE/sdl2" \
            -DSRB2_CONFIG_ENABLE_WEBM_MOVIES=OFF \
            -DSRB2_CONFIG_COPY_RUNTIME_DLLS=OFF \
            -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO="-g -gcodeview -O3 -DNDEBUG" \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-g -gcodeview -O3 -DNDEBUG" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--pdb= -Wl,-s -static -static-libgcc -static-libstdc++ -lpthread" \
            -DSRB2_CONFIG_DEV_BUILD=${{ matrix.dev_build }}

      - name: Build
        run: cmake --build build -- -k 0

      # This is the whole point of the Windows job: a binary that can actually be
      # played on Windows, without needing a local toolchain.
      - name: Upload build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: |
            build/ringracers*.exe
            build/ringracers*.pdb
            build/bin/ringracers*.exe
            build/bin/ringracers*.pdb
          if-no-files-found: warn
